<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sin Excusas</title>
  <meta name="description" content="Tu app de disciplina diaria: hábitos, rachas, enfoque y motivación para no fallar.">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">

  <!-- iPhone: pantalla completa como app nativa -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sin Excusas">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="gFire" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb02e"/><stop offset="1" stop-color="#ff4d3d"/></linearGradient>
      <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cf5b0"/><stop offset="1" stop-color="#16b866"/></linearGradient>
      <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#f0a020"/></linearGradient>
    </defs>
  </svg>

  <div id="app">
    <main id="view" class="view" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Secciones">
      <a href="#hoy" data-tab="hoy" data-icon="list-checks"><span class="ti"></span><span>Hoy</span></a>
      <a href="#dinero" data-tab="dinero" data-icon="wallet"><span class="ti"></span><span>Dinero</span></a>
      <a href="#enfoque" data-tab="enfoque" data-icon="timer"><span class="ti"></span><span>Enfoque</span></a>
      <a href="#stats" data-tab="stats" data-icon="chart-column"><span class="ti"></span><span>Progreso</span></a>
      <a href="#mas" data-tab="mas" data-icon="layout-grid"><span class="ti"></span><span>Más</span></a>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="overlay-root"></div>
  <div id="toast-root" aria-live="assertive"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <noscript><p style="padding:24px;color:#fff">Activa JavaScript para usar Sin Excusas.</p></noscript>

  <script src="js/icons.js"></script>
  <script src="js/frases.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
