<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>KOVA · TikTok serie 2</title>
<link rel="stylesheet" href="fonts.css">
<!--
  Serie 2 de videos de KOVA para TikTok / Reels (1080×1920), con voz en off y subtítulos palabra por palabra.
  ?v=empleado|errores|flujo|demo|costo|instagram|rediseno|agente|detras|dudas   (&t=segundos para vista previa)

  Cada video es una lista de "beats": una frase de la voz (vo) + la escena que se ve mientras se dice.
  render-tiktok2.js genera la voz (voz.py), mide cuánto dura cada frase y en qué segundo se dice cada palabra,
  y llama a build(info). Así cada escena dura exactamente lo que su frase, sin pausas muertas.

  Dentro de una escena, cada elemento con a="pop|up|left|..." aparece:
    w="palabra"   cuando la voz dice esa palabra (w="dos#2" = la segunda vez que la dice)
    t="0.4"       a los 0,4 s de empezar la escena
  sfx="pop|ding|success|cash|whoosh|type" marca un efecto de sonido en ese momento.
  En el texto de la voz, las *palabras entre asteriscos* salen resaltadas en los subtítulos.
-->
<style>
:root{
  --bg:#05060f; --text:#f5f4ff; --muted:#a3a1bd; --g:#25d366; --r:#ff4d6d;
  --a1:#7c5cff; --a2:#00e0ff; --a3:#ff4ecd;
  --grad:linear-gradient(120deg,var(--a1),var(--a2));
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.5,.5,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:Inter,"Noto Color Emoji",sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
.sg,h1,h2,h3{font-family:"Space Grotesk",Inter,"Noto Color Emoji",sans-serif;letter-spacing:-.03em;line-height:1.02;font-weight:700}
.mono{font-family:"JetBrains Mono",monospace}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.g{color:var(--g)} .r{color:var(--r)} .mut{color:var(--muted)}

/* ---------- Fondo con profundidad ---------- */
.bg{position:absolute;inset:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(120px)}
.b1{width:900px;height:900px;left:-380px;top:-120px;background:var(--a1);opacity:.42;animation:bd1 60s ease-in-out infinite alternate}
.b2{width:800px;height:800px;right:-420px;top:640px;background:var(--a2);opacity:.28;animation:bd2 60s ease-in-out infinite alternate}
.b3{width:700px;height:700px;left:120px;bottom:-460px;background:var(--a3);opacity:.22;animation:bd1 50s ease-in-out infinite alternate-reverse}
@keyframes bd1{to{transform:translate(260px,180px) scale(1.2)}}
@keyframes bd2{to{transform:translate(-240px,-220px) scale(1.15)}}
.floor{position:absolute;left:-50%;right:-50%;bottom:-200px;height:1100px;background-image:linear-gradient(rgba(255,255,255,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.07) 2px,transparent 2px);background-size:120px 120px;transform:perspective(900px) rotateX(64deg);transform-origin:bottom;-webkit-mask-image:linear-gradient(transparent,#000 60%);animation:floor 4s linear infinite}
@keyframes floor{to{background-position:0 120px}}
.beam{position:absolute;top:-400px;left:-300px;width:420px;height:3000px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);transform:rotate(24deg);animation:beam 9s ease-in-out infinite}
@keyframes beam{0%{transform:translateX(-200px) rotate(24deg)}100%{transform:translateX(1700px) rotate(24deg)}}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 45%,rgba(0,0,0,.65))}
.grain{position:absolute;inset:0;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>")}

/* Marca */
.bug{position:absolute;left:70px;top:196px;display:flex;align-items:center;gap:14px;font:700 30px "Space Grotesk";letter-spacing:.16em;opacity:.9}
.bug svg{width:46px;height:46px}

/* ---------- Escenario y escenas ---------- */
.stage{position:absolute;left:70px;right:140px;top:258px;height:910px}
.scene{position:absolute;inset:0;visibility:hidden}
.cam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;text-align:center}
/* Entradas y salidas de escena (los segundos los pone build()) */
@keyframes vis{from,to{visibility:visible}}
@keyframes in-whip{from{transform:translateX(110%) skewX(-8deg);filter:blur(24px);opacity:.3}}
@keyframes in-zoom{from{transform:scale(1.5);filter:blur(30px);opacity:0}}
@keyframes in-rise{from{transform:translateY(240px) scale(.92);opacity:0}}
@keyframes in-drop{from{transform:translateY(-260px) scale(.95);opacity:0}}
@keyframes in-flip{from{transform:perspective(1400px) rotateY(70deg);opacity:0}}
@keyframes out-whip{to{transform:translateX(-110%) skewX(8deg);filter:blur(24px);opacity:.3}}
@keyframes out-zoom{to{transform:scale(.7);filter:blur(20px);opacity:0}}
@keyframes out-rise{to{transform:translateY(-220px);opacity:0}}
@keyframes out-drop{to{transform:translateY(240px);opacity:0}}
@keyframes out-flip{to{transform:perspective(1400px) rotateY(-70deg);opacity:0}}
@keyframes ken{from{transform:scale(1)}to{transform:scale(1.06)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}

/* Animaciones de elementos (las activa build() con --d) */
.an{animation-duration:.5s;animation-timing-function:var(--ease);animation-fill-mode:both;animation-delay:calc(var(--d) * 1s)}
.an-pop{animation-name:pop;animation-timing-function:var(--spring)} @keyframes pop{from{opacity:0;transform:scale(.4)}}
.an-up{animation-name:up} @keyframes up{from{opacity:0;transform:translateY(70px)}}
.an-down{animation-name:down} @keyframes down{from{opacity:0;transform:translateY(-70px)}}
.an-left{animation-name:left} @keyframes left{from{opacity:0;transform:translateX(-120px)}}
.an-right{animation-name:right} @keyframes right{from{opacity:0;transform:translateX(120px)}}
.an-fi{animation-name:fi} @keyframes fi{from{opacity:0}}
.an-zoom{animation-name:zoom;animation-duration:.6s} @keyframes zoom{from{opacity:0;transform:scale(1.6);filter:blur(16px)}}
.an-stamp{animation-name:stamp;animation-timing-function:var(--spring)} @keyframes stamp{from{opacity:0;transform:scale(2.4) rotate(-16deg)}to{transform:rotate(-7deg)}}
.an-shake{animation-name:shake;animation-duration:.55s;animation-timing-function:linear} @keyframes shake{0%{opacity:0;transform:scale(.8)}20%{opacity:1;transform:translateX(-16px) scale(1.03)}40%{transform:translateX(13px)}60%{transform:translateX(-9px)}80%{transform:translateX(5px)}}
.an-grow{animation-name:grow;animation-duration:.8s;transform-origin:left} @keyframes grow{from{transform:scaleX(0)}}
.an-growy{animation-name:growy;animation-duration:.8s;transform-origin:bottom} @keyframes growy{from{transform:scaleY(0)}}
.an-out{animation-name:outx;animation-duration:.3s} @keyframes outx{to{opacity:0;transform:scale(.9)}}
.an-dim{animation-name:dim;animation-duration:.4s} @keyframes dim{to{opacity:.35;filter:grayscale(1)}}
.an-draw{animation-name:draw;animation-duration:.7s;animation-timing-function:ease-in-out} @keyframes draw{from{stroke-dashoffset:var(--len,1000)}}
.an-chr{animation-name:chr;animation-duration:.01s;animation-timing-function:linear} @keyframes chr{from{display:none}}
.an-wipe{animation-name:wipe;animation-duration:1.1s;animation-timing-function:cubic-bezier(.65,0,.25,1)} @keyframes wipe{from{clip-path:inset(0 0 0 100%)}}
.an-handle{animation-name:handle;animation-duration:1.1s;animation-timing-function:cubic-bezier(.65,0,.25,1)} @keyframes handle{from{left:100%}}
@property --n{syntax:'<integer>';inherits:false;initial-value:0}
.count{counter-reset:n var(--n)} .count::before{content:counter(n)}
.float{animation:float 5s ease-in-out infinite alternate} @keyframes float{from{transform:translateY(-10px)}to{transform:translateY(12px)}}
.pulse{animation:pulseg 1.4s ease-out infinite} @keyframes pulseg{0%{box-shadow:0 0 0 0 rgba(37,211,102,.55)}80%,100%{box-shadow:0 0 0 30px rgba(37,211,102,0)}}
.spin{animation:spin 1s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
.blinkc{animation:blinkc 1s steps(1) infinite} @keyframes blinkc{50%{opacity:0}}

/* ---------- Subtítulos palabra por palabra ---------- */
.caps{position:absolute;left:70px;right:140px;top:1196px;height:270px}
.chunk{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:4px 18px;visibility:hidden}
.wd{font:800 70px/1.12 Inter,"Noto Color Emoji",sans-serif;letter-spacing:-.02em;padding:2px 12px;border-radius:16px;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.55)}
.wd.em{color:#7dffb2}
@keyframes win{from{opacity:0;transform:translateY(18px) scale(.86)}}
@keyframes hl{from,to{background:var(--grad);color:#07060d;text-shadow:none;transform:scale(1.08)}}
@keyframes cin{from{transform:scale(.94)}}

/* ---------- Piezas reutilizables ---------- */
.kick{font:700 30px "JetBrains Mono";letter-spacing:.18em;text-transform:uppercase;padding:12px 26px;border-radius:99px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.16);color:#d9d6f5}
.h{font-size:84px}
.h2{font-size:64px}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.14);border-radius:36px;box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(6px)}
.row{display:flex;align-items:center;gap:22px;padding:24px 30px;text-align:left;width:100%}
.row .ic{flex:none;width:86px;height:86px;border-radius:24px;display:grid;place-items:center;font-size:48px;background:rgba(255,255,255,.08)}
.row b{display:block;font:700 40px "Space Grotesk";letter-spacing:-.02em}
.row small{display:block;font-size:28px;color:var(--muted);margin-top:4px}
.row .tag{margin-left:auto;font:700 26px Inter;padding:10px 18px;border-radius:99px;background:rgba(37,211,102,.16);color:#7dffb2;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:20px;width:100%}
.price{display:flex;flex-direction:column;align-items:center;gap:6px}
.price small{font:600 40px Inter;color:var(--muted)}
.price b{font:700 250px/0.9 "Space Grotesk";letter-spacing:-.06em}
.price span{font:600 38px Inter;color:#d9d6f5}
.badges{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.badge{font:700 34px Inter;padding:18px 30px;border-radius:99px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16)}
.badge.ok{background:rgba(37,211,102,.14);border-color:rgba(37,211,102,.45);color:#9dffc4}
.big{font:700 330px/.85 "Space Grotesk";letter-spacing:-.07em}
.chk{display:flex;align-items:center;gap:20px;font:600 40px Inter;text-align:left;padding:18px 26px;width:100%}
.chk i{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:32px;background:var(--g);color:#06140b}
.chk i.no{background:var(--r);color:#fff}

/* Teléfono 3D */
.ph{position:relative;width:420px;height:760px;border-radius:66px;background:#0b0a14;border:11px solid #26243c;box-shadow:0 60px 140px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.1),0 0 120px color-mix(in srgb,var(--a1) 35%,transparent);overflow:hidden;flex:none}
.ph::before{content:"";position:absolute;top:14px;left:50%;transform:translateX(-50%);width:140px;height:36px;border-radius:99px;background:#000;z-index:20}
.tilt{transform:perspective(1800px) rotateY(-16deg) rotateX(5deg);animation:tilt 7s ease-in-out infinite alternate}
.tilt-r{transform:perspective(1800px) rotateY(16deg) rotateX(5deg);animation:tiltr 7s ease-in-out infinite alternate}
@keyframes tilt{to{transform:perspective(1800px) rotateY(-4deg) rotateX(2deg) translateY(-12px)}}
@keyframes tiltr{to{transform:perspective(1800px) rotateY(4deg) rotateX(2deg) translateY(-12px)}}
.wa-h{display:flex;align-items:center;gap:16px;padding:64px 22px 18px;background:#1f2c34;text-align:left}
.wa-h .av{width:62px;height:62px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font:800 26px Inter;flex:none}
.wa-h b{display:block;font-size:26px}
.wa-h small{font-size:20px;color:#8fe3b0}
.wa-b{position:absolute;left:0;right:0;top:146px;bottom:0;padding:20px 16px 30px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;background:#0b141a;background-image:radial-gradient(rgba(255,255,255,.035) 2px,transparent 2px);background-size:26px 26px}
.m{max-width:86%;padding:14px 18px 12px;border-radius:22px;font-size:26px;line-height:1.32;text-align:left;flex:none}
.m small{display:block;text-align:right;font-size:17px;opacity:.6;margin-top:3px}
.m.in{align-self:flex-start;background:#202c33;border-top-left-radius:6px}
.m.out{align-self:flex-end;background:#005c4b;border-top-right-radius:6px}
.m-coll{animation-name:mcoll} @keyframes mcoll{from{display:none;opacity:0;transform:translateY(30px)}}

/* Navegador */
.br{width:100%;border-radius:30px;background:#0d0c17;border:1.5px solid rgba(255,255,255,.14);box-shadow:0 40px 100px rgba(0,0,0,.55);overflow:hidden;text-align:left;position:relative}
.br .bar{display:flex;gap:12px;align-items:center;padding:18px 24px;border-bottom:1.5px solid rgba(255,255,255,.08);font-size:24px;color:var(--muted)}
.br .bar i{width:17px;height:17px;border-radius:50%;background:#ff5f57;flex:none}.br .bar i:nth-child(2){background:#febc2e}.br .bar i:nth-child(3){background:#28c840;margin-right:10px}
.br .url{flex:1;padding:9px 18px;border-radius:99px;background:rgba(255,255,255,.07);font-size:23px;color:#d8d4ee}
.br .view{position:relative;height:560px;overflow:hidden}

/* Sitio premium (ficticio) */
.site{position:absolute;inset:0;background:radial-gradient(circle at 85% 18%,color-mix(in srgb,var(--a2) 40%,transparent),transparent 45%),linear-gradient(160deg,#0f1630,#1b1050 60%,#0a0d22);padding:26px 34px}
.site nav{display:flex;align-items:center;gap:24px;font-size:22px;color:#cfd3ff}
.site nav b{font:700 28px "Space Grotesk";color:#fff;margin-right:auto}
.site nav .cta{padding:10px 18px;border-radius:99px;background:var(--g);color:#06140b;font-weight:800}
.site h4{margin-top:56px;width:560px;font:700 60px/1.02 "Space Grotesk";letter-spacing:-.03em;color:#fff}
.site p{margin-top:16px;font-size:26px;color:#c7cbef;width:520px}
.site .btn{display:inline-block;margin-top:26px;padding:20px 32px;border-radius:99px;background:var(--g);color:#06140b;font-size:27px;font-weight:800}
.site .orb{position:absolute;right:40px;top:110px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--a2) 30%,var(--a1) 70%);box-shadow:0 0 80px color-mix(in srgb,var(--a2) 60%,transparent)}
.site .cards{position:absolute;left:34px;right:34px;bottom:26px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.site .cards div{height:110px;border-radius:20px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.14);display:grid;place-items:center;font-size:24px;font-weight:700}
/* Sitio viejo (ficticio) */
.old{position:absolute;inset:0;background:#e9e6dc;color:#333;font-family:"Times New Roman",serif;padding:20px 26px}
.old .ban{background:#3a5f9e;color:#ff0;font:bold 40px "Comic Sans MS","Times New Roman",serif;text-align:center;padding:16px;border:4px ridge #999}
.old marquee,.old .mq{display:block;margin:12px 0;color:#c00;font-size:24px}
.old .cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.old .cols div{height:120px;background:#ccc;border:2px inset #999;display:grid;place-items:center;font-size:20px;color:#666}
.old p{font-size:22px;line-height:1.3;margin-top:12px;color:#444}
.old .hit{position:absolute;right:20px;bottom:20px;font-size:18px;color:#777}

/* Buscador */
.search{width:100%;display:flex;align-items:center;gap:20px;padding:24px 32px;border-radius:99px;background:#fff;color:#202124;font-size:38px;text-align:left;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.mag{width:42px;height:42px;flex:none;border:5px solid #9aa0a6;border-radius:50%;position:relative}
.mag::after{content:"";position:absolute;width:5px;height:17px;background:#9aa0a6;right:-9px;bottom:-13px;transform:rotate(-45deg);border-radius:3px}
.res{width:100%;padding:22px 28px;border-radius:24px;background:#fff;color:#202124;text-align:left}
.res small{display:block;color:#188038;font-size:23px}
.res b{display:block;color:#1a0dab;font-size:34px;margin:2px 0}
.res span{font-size:24px;color:#4d5156}

/* Flujo de automatización */
.flow{position:relative;width:870px;height:900px}
.flow svg.links{position:absolute;inset:0;overflow:visible}
.flow path{fill:none;stroke:color-mix(in srgb,var(--a2) 70%,transparent);stroke-width:5;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:0;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--a2) 60%,transparent))}
.node{position:absolute;width:360px;display:flex;align-items:center;gap:18px;padding:22px 24px;border-radius:28px;text-align:left;background:linear-gradient(160deg,#18243a,#0e1424)!important;z-index:2}
.node .ic{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;font-size:46px;background:linear-gradient(140deg,color-mix(in srgb,var(--a1) 60%,#111),color-mix(in srgb,var(--a2) 50%,#111));flex:none}
.node b{display:block;font:700 38px "Space Grotesk"}
.node small{font-size:26px;color:var(--muted)}
.pkt{position:absolute;left:0;top:0;offset-anchor:center;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 0 20px #fff,0 0 40px var(--a2);offset-rotate:0deg;animation:pkt 1.6s linear infinite}
@keyframes pkt{from{offset-distance:0%}to{offset-distance:100%}}

/* Contadores y barras */
.calc{width:100%;padding:34px 40px;text-align:left}
.cl{display:flex;justify-content:space-between;align-items:baseline;font:600 38px Inter;padding:14px 0;border-bottom:2px dashed rgba(255,255,255,.12)}
.cl b{font:700 46px "Space Grotesk"}
.bars{display:flex;align-items:flex-end;justify-content:center;gap:70px;height:560px;width:100%}
.barc{display:flex;flex-direction:column;align-items:center;gap:16px;width:250px}
.barc .v{font:700 64px "Space Grotesk"}
.barc .b{width:200px;border-radius:26px 26px 10px 10px}
.barc small{font:600 30px Inter;color:#d9d6f5;text-align:center}

/* Instagram (genérico) */
.ig{width:600px;padding:34px;border-radius:40px;text-align:left}
.ig .top{display:flex;align-items:center;gap:26px}
.ig .av{width:130px;height:130px;border-radius:50%;padding:6px;background:linear-gradient(45deg,#f9a825,#e1306c,#833ab4);flex:none}
.ig .av div{width:100%;height:100%;border-radius:50%;background:#1d1b2b;display:grid;place-items:center;font-size:60px}
.ig .st{display:flex;gap:30px;font-size:24px;color:var(--muted)} .ig .st b{display:block;font:700 34px Inter;color:#fff}
.ig .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:26px}
.ig .grid div{aspect-ratio:1;border-radius:10px;background:linear-gradient(140deg,#2b2745,#191729)}
.meter{width:100%;height:46px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0;border-radius:99px;transform-origin:left}
.lockc{display:flex;flex-direction:column;align-items:center;gap:18px;padding:50px 40px;width:100%}
.lockc .ico{font-size:150px;line-height:1}

/* Antes / después */
.ba{position:relative;width:100%;height:640px;border-radius:30px;overflow:hidden;border:1.5px solid rgba(255,255,255,.14);box-shadow:0 40px 100px rgba(0,0,0,.55)}
.ba .layer{position:absolute;inset:0}
.ba .handle{position:absolute;top:0;bottom:0;left:0;width:6px;margin-left:-3px;background:#fff;box-shadow:0 0 30px rgba(255,255,255,.8);z-index:5}
.ba .handle::after{content:"⟷";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font:800 34px Inter}
.lbl{position:absolute;top:18px;padding:10px 20px;border-radius:99px;font:800 24px Inter;letter-spacing:.1em;z-index:6}

/* IA */
.core{position:relative;width:420px;height:420px;display:grid;place-items:center}
.core .ring{position:absolute;inset:0;border-radius:50%;border:3px solid color-mix(in srgb,var(--a2) 60%,transparent);animation:ring 6s linear infinite}
.core .ring:nth-child(2){inset:40px;border-style:dashed;animation-duration:9s;animation-direction:reverse}
.core .ring:nth-child(3){inset:80px;border-color:color-mix(in srgb,var(--a1) 70%,transparent);animation-duration:4s}
@keyframes ring{to{transform:rotate(360deg)}}
.core .nucleus{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--a2) 35%,var(--a1) 75%);box-shadow:0 0 120px var(--a2),0 0 60px var(--a1);display:grid;place-items:center;font:800 64px "Space Grotesk";color:#07060d}

.kpi{padding:24px 26px;text-align:left}

      '<div class="ans an an-right" w="Muchos" sfx="success">Webs y bots sencillos: listos en <span class="g">2–3 días</span>.</div></div>' },
    { tr: "whip", vo: "¿Y si no me gusta? Primero ves una *demo*, y tienes *garantía* *por* *escrito*.", html:
      '<div class="qn an an-fi" t="0">PREGUNTA 4</div><div class="stack" style="gap:30px"><div class="q an an-left" t=".05" sfx="pop">¿Y si no me gusta? 😬</div>' +
      '<div class="ans an an-right" w="Primero" sfx="success">Primero ves una demo. Y tienes garantía por escrito 🛡️</div></div>' }
  ]}
};

// Escenas del flujo (video "flujo"): el mismo gráfico va creciendo nodo a nodo
(function () {
  var N = [
    [40, 20, "📣", "Anuncio", "TikTok · Instagram"],
    [500, 150, "💬", "WhatsApp", "el cliente escribe"],
    [40, 320, "🤖", "Bot con IA", "catálogo y dudas"],
    [500, 470, "💳", "Pago", "link de pago"],
    [40, 620, "📊", "Google Sheets", "pedido guardado"],
    [500, 770, "🔔", "Notificación", "nueva venta 🎉"]
  ];
  var L = [[0, 1], [1, 2], [2, 3], [3, 4], [4, 5]];
  var plan = { "@F1": [["anuncio", "escribe"], 1], "@F2": [["bot", "catálogo"], 2], "@F3": [["link"], 3], "@F4": [["hoja", "notificación"], 5] };
  Object.keys(plan).forEach(function (key) {
    var words = plan[key][0], upto = plan[key][1], shown = { "@F1": -1, "@F2": 1, "@F3": 2, "@F4": 3 }[key];
    var nodes = N.slice(0, upto + 1).map(function (n, i) {
      var attrs = i <= shown ? "" : 'class="an an-pop" w="' + words[Math.min(i - shown - 1, words.length - 1)] + '" sfx="pop"';
      if (i > shown && words.length === 1) attrs = 'class="an an-pop" w="' + words[0] + '"' + (i === upto ? ' sfx="pop"' : "");
      if (key === "@F4" && i === 5) attrs = 'class="an an-pop" w="notificación" sfx="ding"';
      if (key === "@F4" && i === 4) attrs = 'class="an an-pop" w="hoja" sfx="pop"';
      return n.concat([attrs]);
    });
    var links = L.filter(function (l) { return l[1] <= upto; }).map(function (l) {
      var isNew = l[1] > shown;
      var target = nodes[l[1]][5].match(/w="([^"]+)"/);
      return [l[0], l[1], isNew && target ? 'class="an an-draw" w="' + target[1] + '"' : "", isNew && target ? 'class="an an-fi" w="' + target[1] + '"' : ""];
    });
    var html = flow(nodes, links);
    if (key === "@F4") html += '<div class="glass row an an-down" w="notificación" style="position:absolute;left:30px;right:30px;top:-10px;z-index:9"><div class="ic">🔔</div><div><b>Nueva venta · $25,00</b><small>Pedido #209 guardado en tu hoja</small></div></div>';
    VIDEOS.flujo.beats.forEach(function (b) { if (b.html === key) b.html = html; });
  });
})();

var END = { tr: "zoom", flash: true, vo: "Escríbenos por *WhatsApp*. La asesoría es *gratis*, y el link está en el perfil.", html:
  '<svg class="logo an an-zoom" t="0"><use href="#logo"/></svg><div class="brand an an-up" t=".15">KOVA</div>' +
  '<div class="mut an an-up" t=".3" style="font-size:38px;margin-top:-16px">Webs · Bots con IA · Automatizaciones</div>' +
  '<div class="an an-pop" w="WhatsApp" sfx="pop"><div class="wa pulse">' + WA + '<span><small>Escríbenos por WhatsApp</small><b>+593 96 905 3512</b></span></div></div>' +
  '<div class="badge an an-up" w="gratis">🌐 kovaautomatiza.com</div>' };

/* ======================= Construcción de la línea de tiempo ======================= */
var q = new URLSearchParams(location.search);
var vid = q.get("v") || "empleado";
var V = VIDEOS[vid];
V.beats = V.beats.concat([END]);
document.documentElement.style.setProperty("--a1", V.a[0]);
document.documentElement.style.setProperty("--a2", V.a[1]);
document.documentElement.style.setProperty("--a3", V.a[2]);

function clean(t) { return t.replace(/\*/g, ""); }
window.SCRIPT = V.beats.map(function (b) { return clean(b.vo); });

function norm(w) { return w.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9ñ]/g, ""); }
var styleTag = document.createElement("style"); document.head.appendChild(styleTag);
var kf = 0;

// info: [{dur, words:[{w,s,e}]}] por frase (de voz.py). Sin info (vista previa) se estima.
window.build = function (info) {
  var LEAD = .12, GAP = .16, TAIL = 1.8;
  var stage = document.getElementById("stage"), caps = document.getElementById("caps");
  stage.innerHTML = ""; caps.innerHTML = "";
  document.querySelectorAll(".flash.dyn").forEach(function (f) { f.remove(); });
  var T = 0, timeline = { beats: [], cues: [], voice: [] };
  V.beats.forEach(function (b, k) {
    var inf = info && info[k] ? info[k] : estimate(clean(b.vo));
    var last = k === V.beats.length - 1;
    var start = T, vs = start + (k === 0 ? .05 : LEAD);
    var len = (vs - start) + inf.dur + (last ? TAIL : GAP);
    timeline.beats.push({ start: start, len: len, voice: vs });
    timeline.voice.push(vs);
    T += len;
    b._t = { start: start, len: len, vs: vs, words: inf.words, emph: emphasis(b.vo) };
  });
  timeline.dur = T;

  V.beats.forEach(function (b, k) {
    var tm = b._t, next = V.beats[k + 1];
    var sc = document.createElement("div"); sc.className = "scene";
    var cam = document.createElement("div"); cam.className = "cam";
    cam.innerHTML = b.html; sc.appendChild(cam); stage.appendChild(sc);
    var end = next ? next._t.start : timeline.dur + 1;
    var tr = b.tr || "zoom", ntr = next ? (next.tr || "zoom") : null;
    var anims = ["vis " + (end - tm.start + (ntr && ntr !== "none" ? .35 : 0)).toFixed(3) + "s linear " + tm.start.toFixed(3) + "s 1 none"];
    if (tr !== "none" && k > 0) anims.push("in-" + tr + " .45s cubic-bezier(.2,.8,.2,1) " + tm.start.toFixed(3) + "s 1 backwards");
    if (ntr && ntr !== "none") anims.push("out-" + ntr + " .35s cubic-bezier(.6,0,.8,.4) " + (end - .02).toFixed(3) + "s 1 forwards");
    sc.style.animation = anims.join(", ");
    cam.style.zoom = b.z || (/class="flow"/.test(b.html) ? 1 : 1.18);  // todo un poco más grande, salvo el flujo
    if (tr !== "none" && ntr !== "none") cam.style.animation = "ken " + (end - tm.start + .4).toFixed(3) + "s linear " + tm.start.toFixed(3) + "s 1 both";
    if (k > 0 && tr !== "none") timeline.cues.push({ t: tm.start - .12, type: "whoosh" });
    if (b.flash && k > 0) { var fl = document.createElement("div"); fl.className = "flash dyn"; fl.style.animation = "flash .35s ease-out " + tm.start.toFixed(3) + "s 1 none"; document.body.appendChild(fl); }

    // Elementos: a la palabra (w) o a los segundos (t) desde el inicio de la escena
    var seen = {};
    cam.querySelectorAll(".an").forEach(function (el) {
      var t = null;
      if (el.hasAttribute("w")) t = wordTime(tm, el.getAttribute("w"));
      if (el.hasAttribute("t")) t = (t === null ? tm.start : t) + parseFloat(el.getAttribute("t"));
      if (t === null) t = tm.start + .15;
      el.style.setProperty("--d", t.toFixed(3));
      if (el.hasAttribute("sfx")) timeline.cues.push({ t: t, type: el.getAttribute("sfx") });
    });
    // Contadores
    cam.querySelectorAll("[data-count]").forEach(function (el) {
      var host = el.closest(".an"), d = host ? parseFloat(host.style.getPropertyValue("--d")) : tm.start;
      if (el.classList.contains("an")) d = parseFloat(el.style.getPropertyValue("--d"));
      var name = "cnt" + (kf++);
      styleTag.sheet.insertRule("@keyframes " + name + "{from{--n:0}to{--n:" + el.dataset.count + "}}", 0);
      el.classList.add("count");
      el.style.animation = name + " " + (el.dataset.dur || 1.2) + "s cubic-bezier(.2,.7,.25,1) " + d.toFixed(3) + "s 1 both";
    });
    // Trazos SVG: largo real para la animación de dibujo
    cam.querySelectorAll("path").forEach(function (p) { p.style.setProperty("--len", Math.ceil(p.getTotalLength())); });

    buildCaptions(caps, tm, end);
  });
  window.TIMELINE = timeline;
  return { dur: timeline.dur, cues: timeline.cues, voice: timeline.voice, end: V.beats[V.beats.length - 1]._t.start,
    cover: V.beats[1]._t.start - .35 };  // final del gancho
};

function estimate(text) {
  var words = text.split(/\s+/), t = 0, out = [];
  words.forEach(function (w) { var d = .07 * w.length + .1; out.push({ w: w, s: t, e: t + d }); t += d + .04; });
  return { dur: t, words: out };
}
function emphasis(vo) {
  var set = {};
  vo.split(/\s+/).forEach(function (w, i) { if (/\*/.test(w)) set[i] = true; });
  return set;
}
function wordTime(tm, key) {
  var parts = key.split("#"), target = norm(parts[0]), nth = parseInt(parts[1] || "1"), c = 0;
  for (var i = 0; i < tm.words.length; i++) {
    if (norm(tm.words[i].w) === target && ++c === nth) return tm.vs + tm.words[i].s - .06;
  }
  return null;
}
// Subtítulos: grupos de hasta 3-4 palabras (cortan en la puntuación); la palabra que suena se resalta
function buildCaptions(caps, tm, end) {
  var ws = tm.words, chunks = [], cur = [];
  ws.forEach(function (w, i) {
    cur.push(i);
    var chars = cur.reduce(function (n, j) { return n + ws[j].w.length + 1; }, 0);
    if (/[.,;:?!…]$/.test(w.w) || cur.length >= 4 || chars > 20) { chunks.push(cur); cur = []; }
  });
  if (cur.length) chunks.push(cur);
  chunks.forEach(function (ch, ci) {
    var s = tm.vs + ws[ch[0]].s - .04;
    var e = ci + 1 < chunks.length ? tm.vs + ws[chunks[ci + 1][0]].s - .04 : Math.min(end, tm.vs + ws[ws.length - 1].e + .5);
    var div = document.createElement("div"); div.className = "chunk";
    div.style.animation = "vis " + Math.max(.05, e - s).toFixed(3) + "s linear " + s.toFixed(3) + "s 1 none, cin .25s cubic-bezier(.3,1.5,.5,1) " + s.toFixed(3) + "s 1 backwards";
    ch.forEach(function (j, n) {
      var w = ws[j], sp = document.createElement("span");
      sp.className = "wd" + (tm.emph[j] ? " em" : "");
      sp.textContent = w.w.replace(/\*/g, "");
      var ws0 = tm.vs + w.s - .03, we = n + 1 < ch.length ? tm.vs + ws[ch[n + 1]].s - .03 : Math.min(e, tm.vs + w.e + .25);
      sp.style.animation = "win .18s cubic-bezier(.2,.8,.2,1) " + ws0.toFixed(3) + "s 1 backwards, hl " + Math.max(.05, we - ws0).toFixed(3) + "s linear " + ws0.toFixed(3) + "s 1 none";
      div.appendChild(sp);
    });
    caps.appendChild(div);
  });
}

// Congela todas las animaciones y las coloca en el segundo t (lo usa render-tiktok2.js)
window.seek = function (t) {
  document.getAnimations().forEach(function (a) { a.pause(); a.currentTime = t * 1000; });
};
window.ready = document.fonts.ready.then(function () {
  if (!q.has("noauto")) window.PREVIEW = build(null);
  if (q.has("t")) seek(parseFloat(q.get("t")));
});
</script>
